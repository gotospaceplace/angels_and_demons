services:
  game-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "27050:27050/udp"
    volumes:
      - server-config:/opt/angels-and-demons/config
      - server-logs:/opt/angels-and-demons/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  server-config:
  server-logs:
