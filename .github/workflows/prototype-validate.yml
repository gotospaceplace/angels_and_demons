name: Validate Prototypes

on:
  push:
    branches: [main]
    paths:
      - 'Prototypes/**'
      - '.github/workflows/prototype-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Prototypes/**'
      - '.github/workflows/prototype-validate.yml'
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  discover:
    name: Discover prototypes
    runs-on: ubuntu-24.04
    outputs:
      prototypes: ${{ steps.find.outputs.prototypes }}
    steps:
      - uses: actions/checkout@v4

      - name: Find standalone Godot projects
        id: find
        run: |
          PROTOS=$(find Prototypes/ -name 'project.godot' -printf '%h\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "prototypes=$PROTOS" >> "$GITHUB_OUTPUT"
          echo "Found prototypes: $PROTOS"

  validate:
    name: "Validate ${{ matrix.prototype }}"
    runs-on: ubuntu-24.04
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        prototype: ${{ fromJson(needs.discover.outputs.prototypes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Enumerate scripts
        id: scripts
        run: |
          SCRIPTS=$(find "${{ matrix.prototype }}" -name '*.gd' -not -path '*/.godot/*' | sort)
          COUNT=$(echo "$SCRIPTS" | grep -c '.' || echo 0)
          echo "Found $COUNT GDScript file(s) in ${{ matrix.prototype }}:"
          echo "$SCRIPTS"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Headless import and script compilation
        run: |
          # Godot compiles all project scripts during --import.
          # Capture both stdout and stderr for comprehensive error detection.
          godot --headless --path "${{ matrix.prototype }}" --import 2>&1 | tee /tmp/import.log
          ERRORS=$(grep -ciE "SCRIPT ERROR|Failed to load|Cannot preload|Parse Error" /tmp/import.log | head -1 || echo 0)
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "=== Import/compilation errors in ${{ matrix.prototype }} ==="
            grep -iE "SCRIPT ERROR|Failed to load|Cannot preload|Parse Error" /tmp/import.log
            echo ""
            echo "::error::${{ matrix.prototype }}: import produced $ERRORS error(s)"
            exit 1
          fi
          echo "${{ matrix.prototype }}: import and script compilation clean"

      - name: Validate scripts via in-project loader
        if: steps.scripts.outputs.count != '0'
        run: |
          # Create a temporary script that programmatically loads every .gd file
          # in the project and reports any that fail to compile.
          PROTO="${{ matrix.prototype }}"
          cat > "$PROTO/scripts/_ci_validate_all.gd" << 'VALIDATOR'
          extends SceneTree
          func _init() -> void:
              var scripts := _find_scripts("res://")
              var errors := 0
              for path in scripts:
                  if path.ends_with("_ci_validate_all.gd"):
                      continue
                  var scr = load(path)
                  if scr == null:
                      printerr("VALIDATE_FAIL: could not load " + path)
                      errors += 1
                  elif scr is Script and not scr.can_instantiate():
                      printerr("VALIDATE_FAIL: script has errors " + path)
                      errors += 1
                  else:
                      print("VALIDATE_OK: " + path)
              if errors > 0:
                  printerr("VALIDATE_RESULT: %d script(s) failed" % errors)
              else:
                  print("VALIDATE_RESULT: all %d script(s) loaded successfully" % scripts.size())
              quit(errors)

          func _find_scripts(dir_path: String) -> Array[String]:
              var results: Array[String] = []
              var dir := DirAccess.open(dir_path)
              if dir == null:
                  return results
              dir.list_dir_begin()
              var name := dir.get_next()
              while name != "":
                  var full := dir_path.path_join(name)
                  if dir.current_is_dir():
                      if name != ".godot" and name != ".git":
                          results.append_array(_find_scripts(full))
                  elif name.ends_with(".gd"):
                      results.append(full)
                  name = dir.get_next()
              return results
          VALIDATOR
          echo "=== Running in-project script validator ==="
          timeout 30 godot --headless --path "$PROTO" -s scripts/_ci_validate_all.gd 2>&1 | tee /tmp/validate.log
          EXIT=$?
          rm -f "$PROTO/scripts/_ci_validate_all.gd" "$PROTO/scripts/_ci_validate_all.gd.uid"

          if [ $EXIT -ne 0 ] && [ $EXIT -ne 124 ]; then
            echo "::error::${{ matrix.prototype }}: script validation failed (exit $EXIT)"
            grep "VALIDATE_FAIL" /tmp/validate.log || true
            exit 1
          fi

          # Verify the validator actually ran and checked scripts
          if ! grep -q "VALIDATE_RESULT" /tmp/validate.log; then
            echo "::error::${{ matrix.prototype }}: validator did not produce results — scripts may not have been checked"
            exit 1
          fi

          if grep -q "VALIDATE_FAIL" /tmp/validate.log; then
            echo "::error::${{ matrix.prototype }}: one or more scripts failed validation"
            exit 1
          fi
          echo "${{ matrix.prototype }}: all scripts validated"

      - name: Load main scene
        run: |
          SCENE=$(grep 'run/main_scene' "${{ matrix.prototype }}/project.godot" | sed 's/.*="\(.*\)"/\1/' || true)
          if [ -z "$SCENE" ]; then
            echo "::warning::${{ matrix.prototype }}: no main scene configured, skipping scene load"
            exit 0
          fi
          echo "Loading scene: $SCENE"
          timeout 15 godot --headless --path "${{ matrix.prototype }}" --quit-after 2 2>&1 | tee /tmp/scene.log || {
            EXIT=$?
            if [ $EXIT -eq 124 ]; then
              echo "${{ matrix.prototype }}: scene loaded (timed out at shutdown — expected for headless)"
            else
              SCENE_ERRORS=$(grep -ciE "SCRIPT ERROR|Failed to load|Cannot preload" /tmp/scene.log | head -1 || echo 0)
              if [ "$SCENE_ERRORS" -gt 0 ]; then
                echo "::error::${{ matrix.prototype }}: scene load produced errors"
                grep -iE "SCRIPT ERROR|Failed to load|Cannot preload" /tmp/scene.log
                exit 1
              fi
            fi
          }
          echo "${{ matrix.prototype }}: scene load OK"

  canary:
    name: Canary (verify prototype CI catches errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Create canary prototype and validator
        run: |
          mkdir -p /tmp/canary-proto/scripts /tmp/canary-proto/scenes
          cat > /tmp/canary-proto/project.godot << 'PROJ'
          ; Canary prototype for CI verification
          config_version=5
          [application]
          config/name="Canary Prototype"
          run/main_scene="res://scenes/canary.tscn"
          config/features=PackedStringArray("4.7", "GL Compatibility")
          PROJ
          cat > /tmp/canary-proto/scripts/valid.gd << 'VALID'
          extends Node
          func _ready() -> void:
              print("canary valid script loaded")
          VALID
          cat > /tmp/canary-proto/scenes/canary.tscn << 'SCENE'
          [gd_scene format=3]
          [ext_resource type="Script" path="res://scripts/valid.gd" id="1_valid"]
          [node name="Canary" type="Node"]
          script = ExtResource("1_valid")
          SCENE

          # Shared validator script — same approach used by the validate job.
          # Loads every .gd file via Godot's resource system and reports results.
          # Godot 4.7 load() returns non-null for broken scripts, so we also
          # check can_instantiate() to detect parse errors.
          cat > /tmp/canary-validator.gd << 'VALIDATOR'
          extends SceneTree
          func _init() -> void:
              var scripts := _find_scripts("res://")
              var errors := 0
              for path in scripts:
                  if path.ends_with("_ci_validate_all.gd"):
                      continue
                  var scr = load(path)
                  if scr == null:
                      printerr("VALIDATE_FAIL: could not load " + path)
                      errors += 1
                  elif scr is Script and not scr.can_instantiate():
                      printerr("VALIDATE_FAIL: script has errors " + path)
                      errors += 1
                  else:
                      print("VALIDATE_OK: " + path)
              if errors > 0:
                  printerr("VALIDATE_RESULT: %d script(s) failed" % errors)
              else:
                  print("VALIDATE_RESULT: all %d script(s) loaded successfully" % scripts.size())
              quit(errors)

          func _find_scripts(dir_path: String) -> Array[String]:
              var results: Array[String] = []
              var dir := DirAccess.open(dir_path)
              if dir == null:
                  return results
              dir.list_dir_begin()
              var name := dir.get_next()
              while name != "":
                  var full := dir_path.path_join(name)
                  if dir.current_is_dir():
                      if name != ".godot" and name != ".git":
                          results.append_array(_find_scripts(full))
                  elif name.ends_with(".gd"):
                      results.append(full)
                  name = dir.get_next()
              return results
          VALIDATOR

      - name: Canary — valid prototype must pass
        run: |
          echo "=== Canary: importing valid prototype ==="
          godot --headless --path /tmp/canary-proto --import 2>&1 | tee /tmp/canary-import.log

          echo "=== Canary: validating scripts ==="
          cp /tmp/canary-validator.gd /tmp/canary-proto/scripts/_ci_validate_all.gd
          timeout 30 godot --headless --path /tmp/canary-proto -s scripts/_ci_validate_all.gd 2>&1 | tee /tmp/canary-valid.log
          rm -f /tmp/canary-proto/scripts/_ci_validate_all.gd /tmp/canary-proto/scripts/_ci_validate_all.gd.uid

          if ! grep -q "VALIDATE_RESULT" /tmp/canary-valid.log; then
            echo "::error::Canary FAILED — validator did not produce results"
            exit 1
          fi
          if grep -q "VALIDATE_FAIL" /tmp/canary-valid.log; then
            echo "::error::Canary FAILED — valid prototype reported script failures"
            exit 1
          fi
          echo "Canary PASSED — valid prototype scripts all load correctly"
          grep "VALIDATE_OK" /tmp/canary-valid.log
          grep "VALIDATE_RESULT" /tmp/canary-valid.log

      - name: Canary — broken script must be detected
        run: |
          cat > /tmp/canary-proto/scripts/broken.gd << 'BROKEN'
          extends Node
          func _ready() -> void:
              var x: int = "not an int" +++
          BROKEN

          echo "=== Canary: re-importing with broken script ==="
          rm -rf /tmp/canary-proto/.godot
          godot --headless --path /tmp/canary-proto --import 2>&1 | tee /tmp/canary-reimport.log

          echo "=== Canary: running validator with broken script present ==="
          cp /tmp/canary-validator.gd /tmp/canary-proto/scripts/_ci_validate_all.gd
          timeout 30 godot --headless --path /tmp/canary-proto -s scripts/_ci_validate_all.gd 2>&1 | tee /tmp/canary-broken.log || true
          rm -f /tmp/canary-proto/scripts/_ci_validate_all.gd /tmp/canary-proto/scripts/_ci_validate_all.gd.uid

          # Verify the validator ran
          if ! grep -q "VALIDATE_RESULT\|VALIDATE_FAIL\|VALIDATE_OK" /tmp/canary-broken.log; then
            echo "::error::Canary FAILED — validator did not produce any output"
            cat /tmp/canary-broken.log
            exit 1
          fi

          # Primary check: validator must report VALIDATE_FAIL for the broken script
          if grep -q "VALIDATE_FAIL.*broken" /tmp/canary-broken.log; then
            echo "Canary PASSED — broken.gd specifically detected by validator:"
            grep "VALIDATE_FAIL" /tmp/canary-broken.log
          elif grep -q "VALIDATE_FAIL" /tmp/canary-broken.log; then
            echo "Canary PASSED — script failure detected (validator caught a load error):"
            grep "VALIDATE_FAIL" /tmp/canary-broken.log
          else
            echo "::error::Canary FAILED — broken.gd was not detected by validator"
            echo "Full validator log:"
            cat /tmp/canary-broken.log
            exit 1
          fi

          # Secondary check: Godot's own stderr must contain SCRIPT ERROR for the
          # broken file — verifies the engine itself sees the parse failure even
          # though load() returns non-null.
          if grep -qiE "SCRIPT ERROR|Parse Error" /tmp/canary-broken.log; then
            echo "Secondary check PASSED — Godot reported parse/script error in raw output"
          else
            echo "::warning::Secondary check — no SCRIPT ERROR in raw output (can_instantiate still caught it)"
          fi

      - name: Canary — clean prototype must pass after fix
        run: |
          rm -f /tmp/canary-proto/scripts/broken.gd /tmp/canary-proto/scripts/broken.gd.uid
          rm -rf /tmp/canary-proto/.godot

          echo "=== Canary: re-importing after removing broken script ==="
          godot --headless --path /tmp/canary-proto --import 2>&1 | tee /tmp/canary-reimport2.log

          echo "=== Canary: re-validating scripts ==="
          cp /tmp/canary-validator.gd /tmp/canary-proto/scripts/_ci_validate_all.gd
          timeout 30 godot --headless --path /tmp/canary-proto -s scripts/_ci_validate_all.gd 2>&1 | tee /tmp/canary-fixed.log
          rm -f /tmp/canary-proto/scripts/_ci_validate_all.gd /tmp/canary-proto/scripts/_ci_validate_all.gd.uid

          if ! grep -q "VALIDATE_RESULT" /tmp/canary-fixed.log; then
            echo "::error::Canary FAILED — validator did not produce results after fix"
            exit 1
          fi
          if grep -q "VALIDATE_FAIL" /tmp/canary-fixed.log; then
            echo "::error::Canary FAILED — errors persist after removing broken script"
            grep "VALIDATE_FAIL" /tmp/canary-fixed.log
            exit 1
          fi
          echo "Canary PASSED — prototype validates cleanly after broken script removed"
          grep "VALIDATE_RESULT" /tmp/canary-fixed.log

      - name: Canary — missing resource must be detected
        run: |
          cat > /tmp/canary-proto/scenes/missing_ref.tscn << 'SCENE'
          [gd_scene format=3]
          [ext_resource type="Script" path="res://scripts/this_does_not_exist.gd" id="1_missing"]
          [node name="MissingRef" type="Node"]
          script = ExtResource("1_missing")
          SCENE

          echo "=== Canary: checking for missing resource detection ==="
          REFS=$(grep -oP 'res://[^"]+' /tmp/canary-proto/scenes/missing_ref.tscn)
          FOUND_MISSING=false
          for ref in $REFS; do
            local_path="/tmp/canary-proto/${ref#res://}"
            if [ ! -f "$local_path" ]; then
              echo "Missing resource correctly identified: $ref"
              FOUND_MISSING=true
            fi
          done

          if [ "$FOUND_MISSING" = true ]; then
            echo "Canary PASSED — missing resource detection works"
          else
            echo "::error::Canary FAILED — missing resource was not flagged"
            exit 1
          fi
          rm -f /tmp/canary-proto/scenes/missing_ref.tscn
