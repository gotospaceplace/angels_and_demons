name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Import project and check for errors
        run: |
          godot --headless --import 2>&1 | tee /tmp/import.log
          # Filter for genuine errors: parse failures, missing dependencies, broken references
          # Exclude known benign lines (shader cache, theme overrides, first-import noise)
          ERRORS=$(grep -ciE "^ERROR:|SCRIPT ERROR|Failed to load|Cannot preload|Parse Error" /tmp/import.log || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "=== Import errors ==="
            grep -iE "^ERROR:|SCRIPT ERROR|Failed to load|Cannot preload|Parse Error" /tmp/import.log
            echo ""
            echo "::error::Godot import produced $ERRORS error(s)"
            exit 1
          fi
          echo "Import clean — no script or resource errors"

      - name: Validate GDScript files in project context
        run: |
          ERRORS=0
          CHECKED=0
          # Validate each script through the Godot parser in project context.
          # Excludes standalone prototypes (separate project.godot).
          for script in $(find . -name '*.gd' -not -path './.godot/*' -not -path './Angels_Demons_Character_Prototypes/*'); do
            RES_PATH="res://${script#./}"
            CHECKED=$((CHECKED + 1))
            OUTPUT=$(godot --headless --check-only --script "$RES_PATH" 2>&1)
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::error file=${script#./}::GDScript parse error in $RES_PATH"
              echo "$OUTPUT"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo ""
          echo "=== Validated $CHECKED scripts, $ERRORS error(s) ==="
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

      - name: Check for missing resources
        run: |
          # Scan scene, resource, and script files for res:// references.
          # Fail on confirmed missing files (not directories or .godot/ internals).
          MISSING=0
          CHECKED=0
          for ref in $(grep -rhoP 'res://[^")\s]+' --include='*.tscn' --include='*.tres' --include='*.gd' \
                        | sort -u \
                        | grep -v '\.godot/' \
                        | grep -v 'addons/' \
                        | grep -v 'Angels_Demons_Character_Prototypes/'); do
            local_path="${ref#res://}"
            # Skip uid:// references and dynamic paths
            case "$ref" in uid://*) continue ;; esac
            CHECKED=$((CHECKED + 1))
            if [ ! -f "$local_path" ] && [ ! -d "$local_path" ]; then
              echo "::error::Missing resource: $ref"
              MISSING=$((MISSING + 1))
            fi
          done
          echo "Checked $CHECKED resource references, $MISSING missing"
          if [ $MISSING -gt 0 ]; then
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import

      - name: Network tests
        run: timeout 30 godot --headless --path . -- --test-network

      - name: Movement tests
        run: timeout 30 godot --headless --path . -- --test

      - name: Combat tests
        run: timeout 30 godot --headless --path . -- --test-combat

      - name: Validation tests
        run: timeout 30 godot --headless --path . -- --test-validation

      - name: Performance benchmark
        run: timeout 60 godot --headless --path . -- --bench

  canary:
    name: Canary (verify CI catches errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import

      - name: Inject broken script and verify detection
        run: |
          # Create a deliberately broken GDScript file
          cat > tests/_canary_broken.gd << 'BROKEN'
          extends Node
          func _ready() -> void:
              var x : int = "this is not an int"
              nonexistent_function_call()
              return +++
          BROKEN

          echo "=== Canary: validating broken script ==="
          if godot --headless --check-only --script res://tests/_canary_broken.gd 2>&1; then
            echo "::error::Canary FAILED — broken script was not detected by --check-only"
            rm -f tests/_canary_broken.gd
            exit 1
          else
            echo "Canary PASSED — broken script correctly detected (exit code $?)"
          fi
          rm -f tests/_canary_broken.gd

      - name: Inject missing resource reference and verify detection
        run: |
          # Create a scene that references a nonexistent resource
          cat > tests/_canary_missing.tscn << 'SCENE'
          [gd_scene format=3]
          [ext_resource type="Script" path="res://tests/this_does_not_exist.gd" id="1_canary"]
          [node name="CanaryScene" type="Node"]
          script = ExtResource("1_canary")
          SCENE

          echo "=== Canary: checking missing resource detection ==="
          FOUND=$(grep -rhoP 'res://[^")\s]+' tests/_canary_missing.tscn \
                    | while read ref; do
                        local_path="${ref#res://}"
                        if [ ! -f "$local_path" ]; then echo "$ref"; fi
                      done)

          if [ -n "$FOUND" ]; then
            echo "Canary PASSED — missing resource correctly detected: $FOUND"
          else
            echo "::error::Canary FAILED — missing resource was not detected"
            rm -f tests/_canary_missing.tscn
            exit 1
          fi
          rm -f tests/_canary_missing.tscn

  export-server:
    name: Export Linux Server
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin/
          sudo mv "/usr/local/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip /tmp/templates.tpz -d /tmp/tpl
          cp /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: godot --headless --import

      - name: Export server
        run: |
          mkdir -p build/server
          godot --headless --export-release "Linux Server" build/server/angels_and_demons_server.x86_64

      - name: Smoke test server
        run: |
          chmod +x build/server/angels_and_demons_server.x86_64
          timeout 5 ./build/server/angels_and_demons_server.x86_64 --headless --verbose 2>&1 || test $? -eq 124

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-x86_64
          path: build/server/angels_and_demons_server.x86_64
          retention-days: 14
